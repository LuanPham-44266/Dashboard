<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sale Orders - List View</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="sale-app">
        <div class="page-toolbar">
          <div class="toolbar-title-group">
            <span class="toolbar-kicker">Sales</span>
            <h1>Orders</h1>
          </div>

          <div class="toolbar-actions">
            <button class="btn btn-dark" id="newOrderBtn">New</button>
            <button class="btn btn-secondary btn-soft">Import</button>
            <button class="btn btn-secondary btn-soft">Filters</button>
          </div>
        </div>

        <div class="toolbar-search-row">
          <div class="search-filter-group">
            <div class="search-box">
              <input type="text" placeholder="Search orders, customers..." id="searchInput" />
            </div>
            <div class="status-filter-box">
              <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="draft">Draft</option>
                <option value="sale">Sale</option>
                <option value="done">Done</option>
              </select>
            </div>
          </div>
          <div class="toolbar-right-tools">
            <button class="btn btn-outline-light">Action</button>
            <button class="btn btn-primary-dark">Export</button>
          </div>
        </div>

        <div class="card sales-card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-vcenter card-table sales-table" id="ordersTable">
                <thead>
                  <tr>
                    <th class="check-col"><input type="checkbox" /></th>
                    <th class="sortable" data-sort="order_name">Order <span class="sort-indicator"></span></th>
                    <th class="sortable" data-sort="customer_name">Customer <span class="sort-indicator"></span></th>
                    <th>Phone</th>
                    <th class="sortable" data-sort="date_order">Date <span class="sort-indicator"></span></th>
                    <th>Status</th>
                    <th>Items</th>
                    <th class="sortable" data-sort="amount_total">Amount <span class="sort-indicator"></span></th>
                  </tr>
                </thead>
                <tbody id="ordersBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="orderModal">
      <div class="modal-panel modal-lg">
        <div class="modal-header">
          <div>
            <div class="modal-kicker">Sales</div>
            <h3 id="modalTitle">Create Order</h3>
          </div>
          <button class="modal-close" id="closeModalBtn" aria-label="Close">×</button>
        </div>

        <div class="modal-body">
          <div class="status-pipeline" id="statusPipeline" aria-label="Order status pipeline">
            <div class="pipeline-step active" data-state="draft">Draft</div>
            <div class="pipeline-step" data-state="sale">Sale</div>
            <div class="pipeline-step" data-state="done">Done</div>
          </div>

          <div class="form-grid">
            <div class="field-group w-50">
              <label for="customerSelect">Customer</label>
              <select id="customerSelect"></select>
            </div>
            <div class="field-group w-50">
              <label for="orderDate">Order Date</label>
              <input type="datetime-local" id="orderDate" />
            </div>
          </div>

          <div class="order-lines-block">
            <div class="section-header">
              <h4>Order Lines</h4>
              <button type="button" class="btn btn-secondary btn-soft" id="addLineBtn">Add a line</button>
            </div>

            <div class="lines-table-wrap">
              <table class="lines-table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Unit Price</th>
                    <th>Subtotal</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="orderLinesBody"></tbody>
              </table>
            </div>
          </div>

          <div class="form-footer">
            <div class="totals-box">
              <div class="total-row">
                <span>Untaxed</span>
                <strong id="amountUntaxed">0₫</strong>
              </div>
              <div class="total-row total-strong">
                <span>Total</span>
                <strong id="amountTotal">0₫</strong>
              </div>
            </div>

            <div class="action-group">
              <button type="button" class="btn btn-secondary btn-soft" id="cancelModalBtn">Cancel</button>
              <button type="button" class="btn btn-primary-dark" id="confirmOrderBtn">Create Order</button>
              <button type="button" class="btn btn-success hidden" id="confirmSaleBtn">Confirm Order</button>
              <button type="button" class="btn btn-success hidden" id="markDoneBtn">Mark as Done</button>
              <button type="button" class="btn btn-primary-dark hidden" id="saveChangesBtn">Save Changes</button>
              <button type="button" class="btn btn-danger hidden" id="deleteOrderBtn">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const stateMap = {
        draft: { label: 'Draft', className: 'badge-soft' },
        sale: { label: 'Sale', className: 'badge-primary' },
        done: { label: 'Done', className: 'badge-success' },
        sent: { label: 'Sent', className: 'badge-info' },
        cancel: { label: 'Cancel', className: 'badge-danger' },
      };

      const modal = document.getElementById('orderModal');
      const customerSelect = document.getElementById('customerSelect');
      const orderLinesBody = document.getElementById('orderLinesBody');
      const amountUntaxedEl = document.getElementById('amountUntaxed');
      const amountTotalEl = document.getElementById('amountTotal');
      const modalTitle = document.getElementById('modalTitle');
      const confirmOrderBtn = document.getElementById('confirmOrderBtn');
      const confirmSaleBtn = document.getElementById('confirmSaleBtn');
      const markDoneBtn = document.getElementById('markDoneBtn');
      const saveChangesBtn = document.getElementById('saveChangesBtn');
      const deleteOrderBtn = document.getElementById('deleteOrderBtn');
      const statusPipeline = document.getElementById('statusPipeline');
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');

      let allOrders = [];
      let allCustomers = [];
      let allProducts = [];
      let currentOrderId = null;
      let isEditing = false;
      const currentSort = {
        sortBy: 'date_order',
        order: 'desc',
      };

      function formatCurrency(value) {
        return Number(value || 0).toLocaleString('vi-VN', {
          style: 'currency',
          currency: 'VND',
        });
      }

      function formatDateTime(dateValue) {
        if (!dateValue) return '';
        const date = new Date(dateValue);
        if (Number.isNaN(date.getTime())) return '';

        const pad = (n) => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      async function loadDropdownData() {
        const [customersRes, productsRes] = await Promise.all([
          fetch('/api/customers'),
          fetch('/api/products'),
        ]);

        if (!customersRes.ok || !productsRes.ok) {
          throw new Error('Failed to load customer/product dropdowns');
        }

        allCustomers = await customersRes.json();
        allProducts = await productsRes.json();

        customerSelect.innerHTML = allCustomers
          .map(
            (customer) =>
              `<option value="${customer.id}">${customer.name}${customer.phone ? ` - ${customer.phone}` : ''}</option>`
          )
          .join('');
      }

      function renderPipeline(state) {
        const steps = [...statusPipeline.querySelectorAll('.pipeline-step')];
        steps.forEach((step) => {
          const stateName = step.dataset.state;
          step.classList.toggle('active', stateName === state);
          step.classList.toggle('done', ['sale', 'done'].includes(stateName) && state === 'sale');
          step.classList.toggle('done', stateName === 'done' && state === 'done');
        });
      }

      function resetFormState() {
        currentOrderId = null;
        isEditing = false;
        customerSelect.value = allCustomers[0]?.id || '';
        document.getElementById('orderDate').value = formatDateTime(new Date());
        modalTitle.textContent = 'Create Order';
        confirmOrderBtn.classList.remove('hidden');
        confirmSaleBtn.classList.add('hidden');
        markDoneBtn.classList.add('hidden');
        saveChangesBtn.classList.add('hidden');
        deleteOrderBtn.classList.add('hidden');
        renderPipeline('draft');
        buildEmptyLines();
      }

      function buildEmptyLines() {
        orderLinesBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-line-cell">No product lines added yet</td>
          </tr>
        `;
      }

      function addNewLineRow(productId = '', qty = 1, price = '') {
        const row = document.createElement('tr');
        row.className = 'line-row';

        const product = allProducts.find((item) => Number(item.id) === Number(productId));
        const defaultPrice = product ? Number(product.list_price || 0) : Number(price || 0);

        row.innerHTML = `
          <td>
            <select class="line-product-select">
              <option value="">Select product</option>
              ${allProducts
                .map(
                  (productItem) =>
                    `<option value="${productItem.id}" ${Number(productId) === Number(productItem.id) ? 'selected' : ''}>${productItem.name}</option>`
                )
                .join('')}
            </select>
          </td>
          <td><input type="number" min="1" step="1" class="line-qty" value="${qty}" /></td>
          <td><input type="number" min="0" step="0.01" class="line-price" value="${defaultPrice}" /></td>
          <td class="line-subtotal">${formatCurrency((Number(qty) || 0) * (Number(defaultPrice) || 0))}</td>
          <td><button type="button" class="btn btn-link btn-remove-line">Remove</button></td>
        `;

        const productSelect = row.querySelector('.line-product-select');
        const qtyInput = row.querySelector('.line-qty');
        const priceInput = row.querySelector('.line-price');
        const removeBtn = row.querySelector('.btn-remove-line');

        productSelect.addEventListener('change', (event) => {
          const selectedProductId = Number(event.target.value);
          const selectedProduct = allProducts.find((item) => Number(item.id) === selectedProductId);
          if (selectedProduct && priceInput) {
            priceInput.value = Number(selectedProduct.list_price || 0);
          }
          calculateOrderTotal();
        });

        qtyInput.addEventListener('input', calculateOrderTotal);
        priceInput.addEventListener('input', calculateOrderTotal);
        removeBtn.addEventListener('click', () => {
          row.remove();
          if (orderLinesBody.querySelectorAll('.line-row').length === 0) {
            buildEmptyLines();
          }
          calculateOrderTotal();
        });

        orderLinesBody.appendChild(row);
        calculateOrderTotal();
      }

      function calculateOrderTotal() {
        const rows = [...orderLinesBody.querySelectorAll('.line-row')];
        let total = 0;

        rows.forEach((row) => {
          const qtyInput = row.querySelector('.line-qty');
          const priceInput = row.querySelector('.line-price');
          const subtotalCell = row.querySelector('.line-subtotal');

          const qty = Number(qtyInput?.value || 0);
          const price = Number(priceInput?.value || 0);
          const subtotal = qty * price;

          if (subtotalCell) {
            subtotalCell.textContent = formatCurrency(subtotal);
          }

          total += subtotal;
        });

        amountUntaxedEl.textContent = formatCurrency(total);
        amountTotalEl.textContent = formatCurrency(total);
      }

      function collectFormData() {
        const rows = [...orderLinesBody.querySelectorAll('.line-row')];
        const lines = rows
          .map((row) => {
            const productSelect = row.querySelector('.line-product-select');
            const qtyInput = row.querySelector('.line-qty');
            const priceInput = row.querySelector('.line-price');

            if (!productSelect.value || Number(qtyInput.value || 0) <= 0) {
              return null;
            }

            return {
              product_id: Number(productSelect.value),
              quantity: Number(qtyInput.value),
              price_unit: Number(priceInput.value || 0),
            };
          })
          .filter(Boolean);

        return {
          partner_id: Number(customerSelect.value),
          lines,
        };
      }

      async function createOrder() {
        const payload = collectFormData();

        if (!payload.partner_id || !payload.lines.length) {
          alert('Please choose a customer and at least one product line.');
          return;
        }

        try {
          const response = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Failed to create order');

          closeModal();
          await loadOrders();
          alert('Order created successfully.');
        } catch (error) {
          console.error(error);
          alert(error.message || 'An error occurred while creating the order.');
        }
      }

      async function updateOrderStatus(orderId, state) {
        try {
          const response = await fetch(`/api/orders/${orderId}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ state }),
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Failed to update status');

          closeModal();
          await loadOrders();
          return data;
        } catch (error) {
          console.error(error);
          alert(error.message || 'An error occurred while updating status.');
          throw error;
        }
      }

      async function updateOrder(orderId, payload) {
        try {
          const response = await fetch(`/api/orders/${orderId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Failed to update order');

          closeModal();
          await loadOrders();
          return data;
        } catch (error) {
          console.error(error);
          alert(error.message || 'An error occurred while updating order.');
          throw error;
        }
      }

      async function deleteOrder(orderId) {
        if (!confirm('Are you sure you want to delete this order?')) return;

        try {
          const response = await fetch(`/api/orders/${orderId}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Failed to delete order');

          closeModal();
          await loadOrders();
          alert('Order deleted successfully.');
        } catch (error) {
          console.error(error);
          alert(error.message || 'An error occurred while deleting the order.');
        }
      }

      function setOrderFormEditable(isEditable) {
        customerSelect.disabled = !isEditable;
        document.getElementById('orderDate').disabled = !isEditable;

        const addLineBtn = document.getElementById('addLineBtn');
        addLineBtn.disabled = !isEditable;
        addLineBtn.classList.toggle('hidden', !isEditable);

        const lineRows = [...orderLinesBody.querySelectorAll('.line-row')];
        lineRows.forEach((row) => {
          const productSelect = row.querySelector('.line-product-select');
          const qtyInput = row.querySelector('.line-qty');
          const priceInput = row.querySelector('.line-price');
          const removeBtn = row.querySelector('.btn-remove-line');

          if (productSelect) productSelect.disabled = !isEditable;
          if (qtyInput) qtyInput.disabled = !isEditable;
          if (priceInput) priceInput.disabled = !isEditable;
          if (removeBtn) {
            removeBtn.disabled = !isEditable;
            removeBtn.style.visibility = isEditable ? 'visible' : 'hidden';
          }
        });
      }

      function updateSortIndicators() {
        document.querySelectorAll('.sortable').forEach((header) => {
          const indicator = header.querySelector('.sort-indicator');
          const sortKey = header.dataset.sort;
          if (indicator) {
            if (currentSort.sortBy === sortKey) {
              indicator.textContent = currentSort.order === 'asc' ? '↑' : '↓';
            } else {
              indicator.textContent = '';
            }
          }
        });
      }

      function setSort(sortBy, order = null) {
        if (currentSort.sortBy === sortBy) {
          currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
        } else {
          currentSort.sortBy = sortBy;
          currentSort.order = order || 'desc';
        }
        updateSortIndicators();
        loadOrders();
      }

      document.querySelectorAll('.sortable').forEach((header) => {
        header.addEventListener('click', () => {
          setSort(header.dataset.sort);
        });
      });

      async function loadOrders() {
        const tableBody = document.getElementById('ordersBody');

        try {
          const params = new URLSearchParams({
            search: searchInput.value.trim(),
            status: statusFilter.value,
            sortBy: currentSort.sortBy,
            order: currentSort.order,
          });

          const response = await fetch(`/api/orders?${params.toString()}`);
          if (!response.ok) throw new Error('Failed to fetch orders');

          allOrders = await response.json();
          renderOrders(allOrders);
        } catch (error) {
          console.error(error);
          tableBody.innerHTML = `
            <tr>
              <td colspan="8" class="empty-row">Unable to load data from API</td>
            </tr>
          `;
        }
      }

      searchInput.addEventListener('input', () => loadOrders());
      statusFilter.addEventListener('change', () => loadOrders());

      function renderOrders(data, keyword = '') {
        const tableBody = document.getElementById('ordersBody');
        const filtered = data.filter((order) => {
          if (!keyword) return true;
          const text = [
            order.order_name,
            order.customer_name,
            order.phone,
            order.email,
            order.state,
          ]
            .join(' ')
            .toLowerCase();
          return text.includes(keyword.toLowerCase());
        });

        if (!filtered.length) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="8" class="empty-row">No records found</td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = filtered
          .map((order) => {
            const state = stateMap[order.state] || { label: order.state, className: 'badge-soft' };
            const formattedTotal = Number(order.amount_total).toLocaleString('vi-VN', {
              style: 'currency',
              currency: 'VND',
            });
            const formattedDate = new Date(order.date_order).toLocaleString('vi-VN', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
            });

            return `
              <tr data-order-id="${order.id}" class="order-row">
                <td class="check-col"><input type="checkbox" /></td>
                <td><strong>${order.order_name}</strong></td>
                <td>${order.customer_name}</td>
                <td>${order.phone || '-'}</td>
                <td>${formattedDate}</td>
                <td><span class="badge ${state.className}">${state.label}</span></td>
                <td>${Number(order.item_count || 0)}</td>
                <td class="amount-col">${formattedTotal}</td>
              </tr>
            `;
          })
          .join('');

        [...tableBody.querySelectorAll('.order-row')].forEach((row) => {
          row.addEventListener('click', (event) => {
            const checkbox = event.target.closest('input[type="checkbox"]');
            if (checkbox) return;
            const orderId = Number(row.dataset.orderId);
            const order = allOrders.find((item) => item.id === orderId);
            if (order) openModal('edit', order);
          });
        });
      }

      async function deleteOrder(orderId) {
        const confirmed = window.confirm('Bạn có chắc chắn muốn xóa?');
        if (!confirmed) return;

        try {
          const response = await fetch(`/api/orders/${orderId}`, {
            method: 'DELETE',
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Failed to delete order');

          closeModal();
          await loadOrders();
          alert('Xóa đơn hàng thành công.');
        } catch (error) {
          console.error(error);
          alert(error.message || 'Không thể xóa đơn hàng.');
        }
      }

      function syncEditButtons(orderState) {
        const isDraft = orderState === 'draft';
        const isSale = orderState === 'sale';

        confirmOrderBtn.classList.add('hidden');
        confirmSaleBtn.classList.toggle('hidden', !isDraft);
        markDoneBtn.classList.toggle('hidden', !isSale);
        saveChangesBtn.classList.toggle('hidden', !isDraft);
        deleteOrderBtn.classList.toggle('hidden', !isDraft);
        document.getElementById('addLineBtn').classList.toggle('hidden', !isDraft);

        setOrderFormEditable(isDraft);
      }

      function openModal(mode = 'create', order = null) {
        modal.classList.remove('hidden');

        if (mode === 'create') {
          resetFormState();
          confirmOrderBtn.classList.remove('hidden');
          confirmSaleBtn.classList.add('hidden');
          markDoneBtn.classList.add('hidden');
          saveChangesBtn.classList.add('hidden');
          deleteOrderBtn.classList.add('hidden');
          document.getElementById('addLineBtn').classList.remove('hidden');
          setOrderFormEditable(true);
        } else if (mode === 'edit' && order) {
          currentOrderId = order.id;
          isEditing = true;
          modalTitle.textContent = `Order ${order.order_name}`;
          customerSelect.value = order.partner_id || allCustomers[0]?.id || '';
          document.getElementById('orderDate').value = formatDateTime(order.date_order);
          renderPipeline(order.state || 'draft');
          syncEditButtons(order.state || 'draft');
          loadOrderDetailLines(order.id);
        }
      }

      async function loadOrderDetailLines(orderId) {
        try {
          const response = await fetch(`/api/orders/${orderId}/details`);
          if (!response.ok) throw new Error('Load order detail failed');
          const data = await response.json();
          const lines = data.lines || [];

          if (!lines.length) {
            buildEmptyLines();
            calculateOrderTotal();
            return;
          }

          orderLinesBody.innerHTML = '';
          lines.forEach((line) => {
            addNewLineRow(line.product_id, line.product_uom_qty, line.price_unit);
          });

          const currentOrder = allOrders.find((item) => item.id === Number(orderId));
          const isEditable = currentOrder ? currentOrder.state === 'draft' : false;
          setOrderFormEditable(isEditable);
          document.getElementById('addLineBtn').classList.toggle('hidden', !isEditable);

          calculateOrderTotal();
        } catch (error) {
          console.error(error);
          buildEmptyLines();
        }
      }

      function closeModal() {
        modal.classList.add('hidden');
        resetFormState();
      }

      document.getElementById('newOrderBtn').addEventListener('click', () => openModal('create'));
      document.getElementById('closeModalBtn').addEventListener('click', closeModal);
      document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
      document.getElementById('addLineBtn').addEventListener('click', () => {
        const currentOrder = currentOrderId ? allOrders.find((item) => item.id === currentOrderId) : null;
        if (currentOrder && currentOrder.state !== 'draft') return;
        addNewLineRow();
      });
      document.getElementById('confirmOrderBtn').addEventListener('click', createOrder);
      document.getElementById('saveChangesBtn').addEventListener('click', async () => {
        if (!currentOrderId) return;
        const currentOrder = allOrders.find((item) => item.id === currentOrderId);
        if (currentOrder && currentOrder.state !== 'draft') return;
        const payload = {
          partner_id: Number(customerSelect.value),
          lines: [...orderLinesBody.querySelectorAll('.line-row')].map((row) => ({
            product_id: Number(row.querySelector('.line-product-select').value),
            quantity: Number(row.querySelector('.line-qty').value || 0),
            price_unit: Number(row.querySelector('.line-price').value || 0),
          })),
        };

        await updateOrder(currentOrderId, payload);
      });

      confirmSaleBtn.addEventListener('click', async () => {
        if (!currentOrderId) return;
        await updateOrderStatus(currentOrderId, 'sale');
      });

      markDoneBtn.addEventListener('click', async () => {
        if (!currentOrderId) return;
        await updateOrderStatus(currentOrderId, 'done');
      });

      deleteOrderBtn.addEventListener('click', async () => {
        if (!currentOrderId) return;
        await deleteOrder(currentOrderId);
      });

      (async function init() {
        try {
          await loadDropdownData();
          resetFormState();
          updateSortIndicators();
          await loadOrders();
        } catch (error) {
          console.error(error);
          alert('Unable to initialize sales app.');
        }
      })();
    </script>
  </body>
</html>
