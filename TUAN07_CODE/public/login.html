<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css" />
    <style>
      body {
        background: linear-gradient(180deg, #f5f7fb 0%, #eef3ff 100%);
      }

      .page-center {
        min-height: 100vh;
      }

      .container-tight {
        width: min(100%, 440px);
      }

      .card-md {
        width: 100%;
        max-width: 440px;
        border: 1px solid rgba(16, 24, 40, 0.06);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      .card-body {
        padding: 2rem 1.5rem;
      }

      .login-brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: rgba(76, 110, 245, 0.08);
        box-shadow: inset 0 0 0 1px rgba(76, 110, 245, 0.08);
      }

      .login-title {
        margin-bottom: 0.25rem;
        letter-spacing: -0.02em;
      }

      .login-subtitle {
        margin-bottom: 1.5rem;
      }

      .form-label {
        font-weight: 600;
      }

      .login-error {
        min-height: 1.25rem;
        margin-top: 0.75rem;
        font-size: 0.875rem;
        color: #d63939;
      }
    </style>
  </head>
  <body>
    <div class="page page-center">
      <div class="container container-tight py-4">
        <div class="text-center mb-4">
          <a href="/" class="navbar-brand navbar-brand-autodark" aria-label="Trang chủ">
            <span class="login-brand">
              <img src="https://preview.tabler.io/static/logo.svg" alt="Tabler logo" height="24" />
            </span>
          </a>
        </div>

        <form id="loginForm" class="card card-md" autocomplete="off">
          <div class="card-body">
            <div class="text-center mb-4">
              <h1 class="h2 login-title">Đăng nhập</h1>
              <p class="text-muted login-subtitle">Truy cập hệ thống quản lý bán hàng</p>
            </div>

            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input id="email" name="email" type="email" class="form-control" placeholder="sale01@company.com" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Mật khẩu</label>
              <input id="password" name="password" type="password" class="form-control" placeholder="Nhập mật khẩu" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            <div id="loginError" class="login-error" aria-live="polite"></div>
          </div>
        </form>
      </div>
    </div>

    <script>
      const TOKEN_KEY = 'authToken';
      const USER_KEY = 'authUser';

      const savedToken = localStorage.getItem(TOKEN_KEY);
      if (savedToken) {
        window.location.href = '/';
      }

      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const errorBox = document.getElementById('loginError');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';

        const payload = {
          email: emailInput.value.trim(),
          password: passwordInput.value.trim(),
        };

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok || !data.success) {
            throw new Error(data.message || 'Đăng nhập thất bại.');
          }

          localStorage.setItem(TOKEN_KEY, data.token);
          localStorage.setItem(USER_KEY, JSON.stringify(data.user));
          window.location.href = '/';
        } catch (error) {
          errorBox.textContent = error.message || 'Đăng nhập thất bại.';
        }
      });
    </script>
  </body>
</html>
